<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
console.log("========== STUDENT MANAGEMENT SYSTEM ==========");

// PART 1 : BASIC INFORMATION AND VARIABLES

let studentName = "Arun";
let age = 20;
let course = "Full Stack Python";
let subject1 = "JavaScript";
let subject2 = "Python";
let subject3 = "Database";
let mark1 = 85;
let mark2 = 92;
let mark3 = 78;

console.log("\n--- Student Details ---");
console.log("Name:", studentName);
console.log("Age:", age);
console.log("Course:", course);
console.log(subject1 + " Mark:", mark1);
console.log(subject2 + " Mark:", mark2);
console.log(subject3 + " Mark:", mark3);


// PART 2: DATA TYPES AND TYPE CONVERSION

console.log("\n--- Data Types and Type Conversion ---");

let student = "Arun";
let studentAge = 20;
let isPassed = true;

console.log("Student:", student, typeof student);
console.log("Age:", studentAge, typeof studentAge);
console.log("Passed:", isPassed, typeof isPassed);

let stringMark = "85";
let convertedMark = Number(stringMark);

console.log("Converted Mark:", convertedMark);
console.log("Mark + 10:", convertedMark + 10);

let ageString = String(studentAge);
console.log("Age as String:", ageString);
console.log("Data Type:", typeof ageString);


// PART 3: CONDITIONAL STATEMENTS

console.log("\n--- Result and Grade ---");

let marks = [mark1, mark2, mark3];
let total = mark1 + mark2 + mark3;
let average = total / marks.length;

console.log("Total Marks:", total);
console.log("Average:", average);

if (average >= 90) {
    console.log("Grade: A");
} else if (average >= 75) {
    console.log("Grade: B");
} else if (average >= 60) {
    console.log("Grade: C");
} else if (average >= 40) {
    console.log("Grade: D");
} else {
    console.log("Grade: F");
}

if (average >= 40) {
    console.log("Result: Pass");
} else {
    console.log("Result: Fail");
}


// PART 4: LOOPS

console.log("\n--- For Loop: Numbers 1 to 10 ---");

for (let i = 1; i <= 10; i++) {
    console.log(i);
}

console.log("\n--- While Loop: Numbers 5 to 1 ---");

let i = 5;

while (i >= 1) {
    console.log(i);
    i--;
}

console.log("\n--- Total Using a Loop ---");

let loopTotal = 0;

for (let i = 0; i < marks.length; i++) {
    loopTotal += marks[i];
}

console.log("Total Marks:", loopTotal);


// PART 5: ARRAYS

console.log("\n--- Arrays ---");

let subjects = ["JavaScript", "Python", "Database"];
let subjectMarks = [85, 92, 78];

console.log("Subjects:");

for (let i = 0; i < subjects.length; i++) {
    console.log(subjects[i]);
}

let arrayTotal = 0;

for (let mark of subjectMarks) {
    arrayTotal += mark;
}

console.log("Total Marks:", arrayTotal);

let highestMark = Math.max(...subjectMarks);
console.log("Highest Mark:", highestMark);

subjects.push("HTML");
console.log("Subjects After push():", subjects);


// PART 6: FUNCTIONS

console.log("\n--- Functions ---");

function calculateTotal(marks) {
    let total = 0;

    for (let mark of marks) {
        total += mark;
    }

    return total;
}

function calculateAverage(marks) {
    if (marks.length === 0) {
        return 0;
    }

    return calculateTotal(marks) / marks.length;
}

function checkResult(average) {
    return average >= 40 ? "Pass" : "Fail";
}

function findGrade(average) {
    if (average >= 90) {
        return "A";
    } else if (average >= 75) {
        return "B";
    } else if (average >= 60) {
        return "C";
    } else if (average >= 40) {
        return "D";
    } else {
        return "F";
    }
}

let functionTotal = calculateTotal(subjectMarks);
let functionAverage = calculateAverage(subjectMarks);

console.log("Total:", functionTotal);
console.log("Average:", functionAverage);
console.log("Result:", checkResult(functionAverage));
console.log("Grade:", findGrade(functionAverage));


// PART 7: OBJECTS

console.log("\n--- Student Object ---");

let studentInfo = {
    name: "Arun",
    age: 20,
    course: "Full Stack Python",
    subjects: ["JavaScript", "Python", "Database"],
    marks: [85, 92, 78]
};

console.log("Student Name:", studentInfo.name);
console.log("Course:", studentInfo.course);

console.log("Subject Marks:");

for (let i = 0; i < studentInfo.subjects.length; i++) {
    console.log(
        studentInfo.subjects[i] + ": " + studentInfo.marks[i]
    );
}

// Update age
studentInfo.age = 21;

// Add a new property
studentInfo.city = "Thiruvananthapuram";

// Display complete student information
console.log("Complete Student Information:");
console.log(studentInfo);

console.log("\n========== END OF PROGRAM ==========");

    </script>
</body>
</html>
