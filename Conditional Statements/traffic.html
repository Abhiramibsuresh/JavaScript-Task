<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    var signal = prompt("Enter traffic signal color");

if (signal == "Red")
    console.log("Stop");
else if (signal == "Yellow")
    console.log("Ready");
else if (signal == "Green")
    console.log("Go");
else
    console.log("Invalid signal");
</script>
</body>
</html>
