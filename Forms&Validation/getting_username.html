<!DOCTYPE html>
<html>
<body>
<label>Enter your name:</label>
<input type="text" id="name">
<button onclick="showName()">Submit</button>
<p id="result"></p>
<script>
function showName() {
let name = document.getElementById("name").value;
document.getElementById("result").textContent =
"Hello " + name;
}
</script>
</body>
</html>
